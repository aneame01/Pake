      }

      }
      input[type="file"] {
        width: 100%;
        color: #aaa;
        font-size: 12px;
      }

      }

      }

        font-family: monospace;
        font-size: 12px;
        color: #ddd;
      }

        width: 100%;

        background: #111;
        border: 1px solid #444;
        position: relative;
        overflow: hidden;
        cursor: grab;
        user-select: none;
        border-radius: 4px;
      }
      .crop-container:active {
        cursor: grabbing;
      }
      #cropCanvas {
        position: absolute;
        left: 0;
        top: 0;
      }
      .crop-mask {
        position: absolute;
        pointer-events: none;
        border: 2px solid #00ffff;
        box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.65);
      }

      .preview-wrapper {
        display: flex;
        gap: 24px;
        margin-top: 15px;
      }
      .canvas-box {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .canvas-title {
        font-size: 12px;
        font-weight: bold;
        margin-bottom: 6px;
        color: #9cdcfe;
      }

        background: #000;

      }

        border-radius: 4px;
        font-family: monospace;
        font-size: 11px;

        color: #aaa;
      }

        background: #0e639c;
        color: white;

        font-size: 12px;
        font-weight: bold;
      }
      button:hover {
        background: #1177bb;
      }
      button.action-btn {
        background: #2e7d32;
        font-size: 14px;
        padding: 10px;
      }
      button.action-btn:hover {
        background: #388e3c;
      }
      .checkbox-box {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: #ccc;
        cursor: pointer;
      }
      .checkbox-box input {
        accent-color: #0e639c;
      }

    <div class="container">
      <div class="left-col panel">
        <div class="section-title">1. 镜像载入与槽位</div>
        <div class="control-group">
          <label style="color: #4fc1ff">载入 PSP 原版 ISO 镜像：</label>
          <input type="file" id="fileInput" accept=".iso" />
        </div>

        <div class="control-group">
          <label>目标武将编号 (0 - 667)：</label>
          <div style="display: flex; gap: 6px">
            <button id="btnPrev" style="width: 45px">&lt;</button>
            <input type="number" id="charIndex" min="0" max="667" value="0" />
            <button id="btnNext" style="width: 45px">&gt;</button>
          </div>
          <div style="font-size: 11px; color: #888; margin-top: 3px">
            自创男武将区：#538 ~ #607 | 自创女武将区：#608 ~ #637
          </div>
        </div>

        <div class="control-group">
          <label>视图放大倍率：</label>
          <div class="slider-box">
            <input
              type="range"
              id="zoomLevel"
              min="1"
              max="8"
              step="1"
              value="4"
            />
            <span id="zoomVal">4x</span>
          </div>
        </div>

        <div class="section-title" style="margin-top: 10px">3. 注入导出</div>
        <button id="btnSaveIso" class="action-btn">一键注入并导出新 ISO</button>
        <div class="info-box" id="infoBox">等待载入游戏 ISO 镜像...</div>
      </div>

      <div class="mid-col panel">
        <div class="section-title">2. 图像调整与人脸裁切</div>
        <div class="control-group">
          <label>导入图片：</label>
          <input type="file" id="imageInput" accept=".png,.jpg,.jpeg,.bmp" />
        </div>

        <div class="crop-container" id="cropBox">
          <canvas id="cropCanvas"></canvas>
          <div class="crop-mask" id="cropMask"></div>
        </div>
        <div style="font-size: 11px; color: #888">
          框内按住鼠标拖拽平移；滚轮或下方滑块缩放特写。
        </div>

        <div class="control-group" style="margin-top: 6px">
          <label>特写放大比例：</label>
          <div class="slider-box">
            <input
              type="range"
              id="faceScale"
              min="0.1"
              max="3"
              step="0.02"
              value="0.56"
            />
            <span id="scaleVal">0.56x</span>
          </div>
        </div>

        <div class="control-group">
          <label>对比度微调 (推荐 100~115%)：</label>
          <div class="slider-box">
            <input
              type="range"
              id="filterContrast"
              min="80"
              max="150"
              step="5"
              value="110"
            />
            <span id="contrastVal">110%</span>
          </div>
        </div>

        <div class="control-group">
          <label>亮度微调：</label>
          <div class="slider-box">
            <input
              type="range"
              id="filterBrightness"
              min="80"
              max="150"
              step="2"
              value="100"
            />
            <span id="brightnessVal">100%</span>
          </div>
        </div>

        <div class="control-group">
          <label>边缘保真锐化 (建议 10~20%)：</label>
          <div class="slider-box">
            <input
              type="range"
              id="filterSharpen"
              min="0"
              max="60"
              step="5"
              value="15"
            />
            <span id="sharpenVal">15%</span>
          </div>
        </div>

        <label class="checkbox-box">
          <input type="checkbox" id="chkBorder" checked />
          自动合成原版微光衰自适应浮雕边框
        </label>
      </div>

      <div class="right-col panel">
        <div class="section-title">实机硬件级渲染对比</div>
        <div class="preview-wrapper">
          <div class="canvas-box">
            <div class="canvas-title" id="origTitle">原版头像：#0</div>
            <canvas
              id="origCanvas"
              class="pixelated"
              width="48"
              height="60"
            ></canvas>
          </div>
          <div class="canvas-box">
            <div class="canvas-title" style="color: #4fc1ff">
              裁剪增强 (48×60)
            </div>
            <canvas
              id="preProcessedCanvas"
              class="pixelated"
              width="48"
              height="60"
            ></canvas>
          </div>
          <div class="canvas-box">
            <div class="canvas-title" style="color: #69f0ae">
              实机母盘映射 (所见即所得)
            </div>
            <canvas
              id="prevHardwareCanvas"
              class="pixelated"
              width="48"
              height="60"
            ></canvas>
          </div>
        </div>
      </div>
    </div>
